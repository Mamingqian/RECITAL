  secondary_source: apex_saureus
  metric: mic_micromolar
  within_condition: median
  across_conditions: minimum
  incomplete_scores: report_incomplete_with_original_denominator
control:
  proposals:
    candidates_per_round: 1
    candidate_budget: 21
    rounds_min: 21
    rounds_max: 21
    anchor_candidate: false
    max_decision_attempts: 3
    max_skipped_rounds: 1
  budget:
    steps:
      min: 128
      default: 256
      max: 1024
  selection:
    visible_only: true
    plan:
      aggregation: single
      components:
      - measurement: activity_ecoli
      count:
        AMP: 30
      strata:
      - AMP
      filters:
      - measurement: legal
        minimum: 1
      deduplication: exact
      exclude_training_copies: true
      alphabet: ACDEFGHIKLMNPQRSTVWY
      min_length: 5
      max_length: 32
      missing: error
  health:
    min_distance_fraction: 0.257
    min_pairwise_ratio: 0.2
  stop:
    require_assignment_qualified: true
    min_updates_fraction: 0.0
  selfval:
    scalar: cm_raw
  synthesis:
    enabled: false
    roles: []
    max_requests: 0
    attempts_per_request: 3
  checks_text: false
  modules:
    reviewers:
      known_peptides: backends/amp_assets/grampa/grampa.csv
      measurements:
        activity: activity_ecoli
        amp_likelihood: amp_likelihood
        nontoxic: nontoxic
        nonhemolytic: nonhemolytic
        plddt: plddt_esmfold
llm:
  model: gpt-6-luna
  max_prompt_tokens: 60000
  max_output_tokens: 16000
  tool_calls_per_decision: 4
  max_total_tokens: 1300000
  pricing_usd_per_mtok:
    input: null
    cached: null
    output: null
scheduler:
  max_concurrent_jobs: 15
  partition: gpu
  gres: gpu:1
  cpus: 2
  mem: 16G
  time_factor: 1.6
  max_infra_retries: 2
  poll_seconds: 60
macamp:
  sandbox_steps: 128
  real_steps: 384
