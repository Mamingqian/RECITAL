task_family: amp
contract_path: configs/amp_broad_contract.yaml
# min3: the lowest of a peptide's E. coli, S. aureus and P. aeruginosa activity scores ranks the delivered library
# (tasks/amp/adapter.py); the selection component below ranks by that measurement.
pathogen: min3
# The Zenodo record 17018363 files (MIC regressors and their GPT-2 architecture) and the table of public MIC records.
asset_root: backends/amp_assets/zenodo_17018363
known_peptides: backends/amp_assets/grampa/grampa.csv
workers:
  macrel_python: backends/amp_assets/envs/macrel/bin/python
  toxinpred3_python: backends/amp_assets/envs/toxinpred3/bin/python
  apex_python: backends/amp_assets/envs/apex/bin/python
  apex_dir: backends/amp_assets/apex
training_precision: fp32
protocol_condition: no_self_validation
seed: 3101
# Fifteen candidates at the declared default of 256 updates use 3840 of this; the rest is for candidates that train deeper (at
# most control.budget.steps.max each).
total_updates: 7680
initial_schedule_horizon: 1024
# lr and kl are bounded by the contract's `framework.learning_rate_bounds` and `framework.kl_bounds`.
online_generation:
  count: 1000
  count_scope: total
  temperature: 1.0
  top_p: 1.0
  batch_size: 125
delivery:
  count: 30
  count_scope: total
blind_report:
  primary_source: apex_ecoli
  secondary_source: apex_saureus
  metric: mic_micromolar
  within_condition: median
  across_conditions: minimum
  incomplete_scores: report_incomplete_with_original_denominator

control:
  proposals:
    candidates_per_round: 3
    candidate_budget: 15
    rounds_min: 3
    rounds_max: 5
    anchor_candidate: true
    max_decision_attempts: 3
    max_skipped_rounds: 1
  budget:
    steps: {min: 128, default: 256, max: 1024}
  # How a delivered library is chosen from a candidate's pool: the 30 distinct, legal peptides that are not in the public MIC table
  # with the highest activity_min3 (the lowest of the three activity scores; top 30 of 1000). Every arm uses this rule.
  selection:
    visible_only: true
    plan:
      aggregation: single
      components:
        - {measurement: activity_min3}
      count: {AMP: 30}
      strata: [AMP]
      filters:
        - {measurement: legal, minimum: 1}
      deduplication: exact
      exclude_training_copies: true
      alphabet: ACDEFGHIKLMNPQRSTVWY
      min_length: 5
      max_length: 32
      missing: error
  # Library health, relative to the baseline pool (control/health.py); the two fractions of the CRE and CM declarations.
  health:
    min_distance_fraction: 0.257
    min_pairwise_ratio: 0.20
  stop:
    require_assignment_qualified: true
    min_updates_fraction: 0.0
  # `cm_raw`: a source's per-row measurement is its raw predictor score, named by the source.
  selfval:
    scalar: cm_raw
  synthesis:
    enabled: true
    roles: [cross_oracle_aggregation, per_sequence_penalty, hard_biological_gate]
    max_requests: 100
    attempts_per_request: 3
llm:
  model: gpt-6-luna
  max_prompt_tokens: 60000
  max_output_tokens: 16000
  tool_calls_per_decision: 4
  # 0.5M tokens per search; the stored chorismate-mutase searches used about 0.2M.
  max_total_tokens: 500000
  pricing_usd_per_mtok: {input: null, cached: null, output: null}
scheduler:
  max_concurrent_jobs: 15
  partition: gpu
  gres: "gpu:1"
  cpus: 2
  mem: 8G
  time_factor: 1.6
  max_infra_retries: 2
  poll_seconds: 60
