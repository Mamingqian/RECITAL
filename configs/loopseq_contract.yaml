task:
  name: loopseq_selected_library
  description: 'Generate 50bp DNA sequences targeting one of three coarse cyclizability

    groups (low, mid, high) on the Basu Loop-seq dataset. The base policy is

    HyenaDNA-tiny initialized from group-conditioned supervised fine-tuning.

    '
  biological_constraints:
  - Raw sequences must be 50 bp and contain only A/C/G/T.
  - Every requested group must satisfy the structural and biological requirements.
  - Required quality references must be frozen input files; missing calibration means
    unknown.
  target_objective: Generate balanced low/mid/high libraries. Rank structurally valid
    candidates by the minimum group CNN hit rate in every protocol condition. Self-validation
    eligibility uses declared held-out evidence only in the self_validating condition.
    DNAcycP2 remains a terminal-only audit.
base_models:
- id: hyenadna-tiny-sft-group3
  model: backends/loopseq_rl/outputs/sft_group3_v1
  role: policy
  init: sft.completion_only
  notes: Mounted SFT starting policy. Loadability does not establish conditional
    qualification; corrected SFT promotion is separate.
data:
  unified_parquet: backends/loopseq_rl/data/processed/unified_main.parquet
  split:
    source: persisted unified parquet split column; no resplitting
  conditioning_prompts:
  - <CYC_GROUP_LOW>
  - <CYC_GROUP_MID>
  - <CYC_GROUP_HIGH>
  token_alphabet: ACGT
  evaluation_sampling:
    max_new_tokens: 50
    min_new_tokens: 50
    do_sample: true
    temperature: 1.0
    top_p: 1.0
    add_special_tokens: false
    constrain_alphabet: true
    batch_size: 512
    repetition_penalty: 1.0
    use_cache: false
  success_measurement:
    groups:
    - low
    - mid
    - high
    conditioning_groups:
      <CYC_GROUP_LOW>: low
      <CYC_GROUP_MID>: mid
      <CYC_GROUP_HIGH>: high
    sequence_length: 50
    kmer_size: 3
    online_oracles:
    - cnn
    - mixbend
    - bendnet
    training_reference:
      path: backends/loopseq_rl/data/processed/unified_main.parquet
      sha256: 38d9367e891ce0f455c9df963f05b07c63627d60eadffffd4073a2e4c605079c
      sequence_column: seq50
      split_column: split
      split_value: train
    quality_reference:
      path: outputs/loopseq_inputs/conditional_quality_reference.json
      sha256: c060e327cf79da0d49243e5ceb5fc4352e891cef218ed140e6babd4f9a0d0d81
      status: measured
  initial_reward_spec:
    enabled_oracles:
    - cnn
    held_out_oracles:
    - bendnet
    - mixbend
    transforms: []
    # Without this the declared first segment resolves the implicit target_default,
    # whose utility is flat inside the interval: an in-target sequence scores 0, so the
    # GRPO advantage and the selection ranking lose their signal. A promoted
    # sentinel still defaults to target_default, since oracle_utilities may name only
    # enabled oracles.
    oracle_utilities:
      cnn:
        name: target_margin
    aggregator:
      name: trimmed_mean
      trim: 0.0
    shape: null
    penalties: []
    gates: []
    hyperparameters:
      lr: 0.0001
      kl: 0.02
      group_size: 32
      steps: 16000
      condition_repeats:
        '0': 1
        '1': 1
        '2': 1
  initial_quality_penalty_weight: 0.3
oracles:
  candidate_pool:
  - id: cnn
    class: tasks.loopseq.oracles.cnn_ensemble.CNNEnsembleOracle
    use_for: reward
    low_mid_boundary: -0.44933514443471667
    mid_high_boundary: 0.32991884970575086
    boundary_source: "train-split z_cyc terciles (quantiles 1/3 & 2/3 of\
      \ unified_main.parquet[split==train], n=137987). NOTE: hits are scored on the CNN\
      \ output (a shrunk regression-to-mean estimate of z_cyc), so extreme low/high\
      \ groups are intentionally harder \u2014 a disclosed property."
    held_out_pearson: 0.85
    notes: Internal CNN ensemble; fastest online oracle (~ms per batch on GPU).
    score_units: z_cyc
    target_scale: 1.0
  - id: mixbend
    class: tasks.loopseq.oracles.mixbend.MIXBendOracle
    use_for: spendable_sentinel
    low_mid_boundary: -0.513096
    mid_high_boundary: 0.324634
    boundary_source: frozen oracle audit; train-split adjacent-group median midpoints
    notes: 'DNABERT-6 bimodal ensemble; reward-eligible and fast enough to run on
      every

      RL step.

      '
    self_validation_notes: 'Starts HELD OUT and is scored every iteration, so you
      can see what it says.

      It is SPENDABLE: you may move it into enabled_oracles, once, permanently.

      MIXBend and BendNet are computational predictors of the same property scored on

      the same rows; neither is an independent measurement, and nothing in the metadata

      ranks them.

      '
    score_units: mixbend_raw_prediction
    target_scale: 1.0
  - id: bendnet
    class: tasks.loopseq.oracles.bendnet.BendNetOracle
    use_for: sentinel
    low_mid_boundary: -0.507762
    mid_high_boundary: 0.224096
    boundary_source: frozen oracle audit; train-split adjacent-group median midpoints
    notes: 'Compact Keras CNN trained on bendability data, scored on the same rows as the

      reward. Prespecified as the required detector that cannot enter the reward, ensuring

      one computational measurement remains unoptimized after any spend. It predicts raw

      bendability in its own coordinates; agreement with it is agreement between two models

      of the same property, not a wet-lab measurement.

      '
    score_units: bendnet_raw_prediction
    target_scale: 1.0
  - id: dnacycp2
    class: tasks.loopseq.oracles.dnacycp2.DNAcycP2Oracle
    use_for: audit
    low_mid_boundary: -0.375923
    mid_high_boundary: 0.403352
    boundary_source: frozen oracle audit; train-split adjacent-group median midpoints
    notes: 'Subprocess (~30s/batch); framework-owned blind evaluator in the primary

      fold and scored only after the outer loop is terminal.

      '
    score_units: dnacycp2_raw_prediction
    target_scale: 1.0
self_validation:
  primary_fold:
    reward_oracles:
    - cnn
    - mixbend
    required_enabled_oracles:
    - cnn
    held_out_oracles:
    - bendnet
    - mixbend
    required_held_out_oracles:
    - bendnet
    audit_oracles:
    - dnacycp2
  calibration_scope: frozen_train_split
  limitation: within-lineage cross-model monitoring; not independent validation
framework:
  terminal_eligibility:
    rule_id: complete_evidence_advisory_flags_v2
    required_monitors: []
    required_strata:
    - low
    - mid
    - high
  iteration_budget: 25
  critic_max_revisions: 3
  paired_synthesis:
    protocol_id: loopseq_selected_library
    search_budget:
      max_total_updates: 128000
      first_candidate_updates: 16000
      allowed_candidate_updates:
      - 4000
      - 8000
      - 16000
      - 32000
      - 64000
      eval_interval_updates: 16000
      max_eval_slots: 8
      max_trained_candidates: 8
      max_proposals: 24
      max_synthesis_attempts: 12
      evaluation_mode: final
    paired_seeds:
    - 0
    - 1
    - 2
    fixed_group_size: 32
    scope: Three protocol conditions paired across seeds 0, 1, 2; same 128000 update
      budget, at most eight candidates and final evaluations; identical initial policy,
      recipe and editable depth choices.
success:
  requirements:
  - id: raw_legal
    metric: legal_ratio
    strata: &id001
    - low
    - mid
    - high
    minimum: 1.0
    min_count: 128
  - id: rc_diversity
    metric: rc_unique_ratio
    strata: *id001
    minimum: 0.9
    min_count: 128
  - id: conditional_entropy
    metric: entropy_pass_ratio
    strata: *id001
    minimum: 0.95
    min_count: 128
  - id: conditional_kmers
    metric: kmer_pass_ratio
    strata: *id001
    minimum: 0.95
    min_count: 128
  - id: no_training_recitation
    metric: train_exact_overlap
    strata: *id001
    maximum: 0.0
    min_count: 128
  - id: condition_valid_ratio
    metric: condition_valid_ratio
    strata:
    - all
    minimum: 1.0
    min_count: 384
  - id: group_balance_ratio
    metric: group_balance_ratio
    strata:
    - all
    minimum: 1.0
    min_count: 384
  - id: delivery_size
    metric: generated_count
    strata:
    - low
    - mid
    - high
    minimum: 128
    maximum: 128
    min_count: 1
  ranking:
  # Membership first, then how far inside the band. The control layer ranks each condition on its own
  # stratum (control/selection.py), so `reduction` reduces one value and min and mean coincide.
  # The delivered library takes each condition's rows of greatest margin/cnn, so oracle_hit/cnn reads
  # 1.0000 whenever the pool holds 128 eligible in-band rows in that condition and below it otherwise.
  # Where it ties, oracle_margin/cnn orders what remains. Tolerance is 0.0 on both: a tolerance
  # wide enough to call successive deliveries within one run indistinguishable would tie every
  # delivery and always take the earliest.
  #
  # Mid is the only two-sided band, so its margin is bounded by half the band width (0.3896 for the
  # cnn). Low and high are half-open, so their margins have no upper bound, and a candidate can rank
  # first on either by driving the predictor further past a bound it was only asked to clear. The
  # terminal DNAcycP2 blind evaluation, which enters no reward or selection, is what prices that.
  - metric: oracle_hit/cnn
    strata: *id001
    direction: maximize
    reduction: min
    tolerance: 0.0
  - metric: oracle_margin/cnn
    strata: *id001
    direction: maximize
    reduction: min
    tolerance: 0.0
  stop_when_qualified: false
  metric_sources:
    condition_valid_ratio: []
    entropy_pass_ratio: []
    group_balance_ratio: []
    joint_hit:
    - cnn
    - mixbend
    - bendnet
    joint_target_quality_ratio:
    - cnn
    - mixbend
    - bendnet
    kmer_pass_ratio: []
    legal_ratio: []
    oracle_hit/bendnet:
    - bendnet
    oracle_hit/cnn:
    - cnn
    oracle_hit/mixbend:
    - mixbend
    oracle_margin/bendnet:
    - bendnet
    oracle_margin/cnn:
    - cnn
    oracle_margin/mixbend:
    - mixbend
    rc_unique_ratio: []
    train_exact_overlap: []
    generated_count: []
recipe_capabilities:
  allowed_reward_fields:
  - enabled_oracles
  - held_out_oracles
  - target_objectives
  - oracle_utilities
  - aggregator
  - penalties
  - gates
  editable_hyperparameters:
    lr:
      type: number
      minimum: 1.0e-06
      maximum: 0.0005
    kl:
      type: number
      minimum: 0.001
      maximum: 0.2
    group_size:
      type: integer
      enum:
      - 32
    steps:
      type: integer
      minimum: 4000
      maximum: 64000
    condition_repeats:
      type: object
      properties:
        '0':
          type: integer
          minimum: 1
          maximum: 3
        '1':
          type: integer
          minimum: 1
          maximum: 3
        '2':
          type: integer
          minimum: 1
          maximum: 3
      required:
      - '0'
      - '1'
      - '2'
      additionalProperties: false
  allowed_primitives:
  # target_default is flat inside an interval, so an in-target sequence scores 0 and
  # both the GRPO advantage and the selection ranking lose their signal.
  # target_margin keeps the declared penalty outside the interval and the depth inside.
  - - per_oracle_utility
    - target_margin
  - - cross_oracle_aggregation
    - trimmed_mean
  - - per_sequence_penalty
    - at_homopoly
  - - hard_biological_gate
    - gc_bounds_gate
  - - hard_biological_gate
    - homopolymer_gate
  - - hard_biological_gate
    - dinucleotide_entropy_gate
  - - per_sequence_penalty
    - loopseq_reference_quality
  - - per_oracle_utility
    - target_default
  frozen_requirements: {}
  frozen_target_objectives: {}
  frozen_hyperparameters: {}
  runtime_parameters: {}
  allow_primitive_requests: true
  synthesizable_roles:
  - per_oracle_utility
  - cross_oracle_aggregation
  - per_sequence_penalty
  - hard_biological_gate
delivery:
  protocol: selected_evaluation_library_v1
  evaluation_candidates: 512
  count: 128
  primary_oracle: cnn
  selection_aggregation: primary
  deduplication: reverse_complement
  exclude_training_copies: true
