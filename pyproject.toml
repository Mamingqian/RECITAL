[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recital"
version = "0.2.0"
description = "RECITAL: multi-agent search for the reward-and-training recipe of a biological sequence generator"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "RECITAL authors" }]

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "openai>=1.30",
  "pydantic>=2.6",
  "pyarrow>=15.0",
  "jsonschema>=4.22",
  "tiktoken>=0.7",
  "rapidfuzz>=3.14",
]

[project.optional-dependencies]
train = [
  "torch>=2.6,<2.7",
  "transformers==4.57.3",
  "trl==0.26.2",
  "datasets>=4.4,<5",
  "accelerate>=1.9,<2",
  "safetensors>=0.5",
  "huggingface-hub>=0.34",
]
cm = [
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "biopython>=1.85",
  "sentencepiece>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
"tasks.loopseq" = ["*.yaml"]
"tasks.promoter" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
